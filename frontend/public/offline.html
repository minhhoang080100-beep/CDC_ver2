<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0866ff" />
  <title>Không có kết nối - Công Đoàn</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #ffffff;
      padding: 24px;
      overflow: hidden;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.15), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.1), transparent),
        radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,0.12), transparent),
        radial-gradient(2px 2px at 80% 50%, rgba(255,255,255,0.08), transparent),
        radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.1), transparent),
        radial-gradient(2px 2px at 70% 90%, rgba(255,255,255,0.12), transparent);
      animation: drift 20s linear infinite;
      z-index: 0;
    }

    @keyframes drift {
      from { transform: translateX(0) translateY(0); }
      to   { transform: translateX(-10%) translateY(-10%); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 420px;
    }

    .icon-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(8, 102, 255, 0.4); }
      50%      { box-shadow: 0 0 0 20px rgba(8, 102, 255, 0); }
    }

    .icon-wrapper svg {
      width: 56px;
      height: 56px;
      opacity: 0.9;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #0866ff, #0050e6);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(8, 102, 255, 0.35);
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(8, 102, 255, 0.5);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .retry-btn:hover svg {
      transform: rotate(180deg);
    }

    .brand {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </div>

    <h1>Không có kết nối mạng</h1>
    <p>
      Ứng dụng Công Đoàn cần kết nối Internet để tải dữ liệu mới nhất.
      Vui lòng kiểm tra kết nối Wi-Fi hoặc dữ liệu di động rồi thử lại.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
      </svg>
      Thử lại
    </button>
  </div>

  <div class="brand">Công Đoàn Cảng Nghệ Tĩnh</div>
</body>
</html>
